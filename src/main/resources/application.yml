spring:
  application:
    name: board
  profiles:
    default: local
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

app:
  storage:
    location: ${APP_STORAGE_LOCATION:./uploads}
  oauth:
    google:
      enabled: ${GOOGLE_LOGIN_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

logging:
  level:
    # Keep request bodies and rejected password values out of Spring MVC debug/trace logs.
    org.springframework.web: INFO
    # Authorization codes, state and provider tokens must not appear in debug/trace logs.
    org.springframework.security: INFO

management:
  endpoints:
    access:
      default: none
      max-permitted: read-only
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,mappings
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
    info:
      access: read-only
    metrics:
      access: read-only
    mappings:
      access: read-only

server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    csrf:
      enabled: true
  api-docs:
    path: /v3/api-docs

spring:
  application:
    name: board
  profiles:
    default: local
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

app:
  storage:
    location: ${APP_STORAGE_LOCATION:./uploads}
  security:
    csrf:
      rate-limit:
        # Local baseline. Tune these values from observed token traffic, instance
        # capacity and the exported rate-limit metrics in each deployment.
        capacity: ${CSRF_RATE_LIMIT_CAPACITY:20}
        refill-tokens: ${CSRF_RATE_LIMIT_REFILL_TOKENS:20}
        refill-period: ${CSRF_RATE_LIMIT_REFILL_PERIOD:1m}
        max-sources: ${CSRF_RATE_LIMIT_MAX_SOURCES:4096}
    login:
      rate-limit:
        # These are project initial values, not thresholds mandated by a standard.
        # Tune them from observed login metrics, traffic and instance capacity.
        # State is held per application instance; use a shared store when scaling out.
        source-account-threshold: ${LOGIN_RATE_LIMIT_SOURCE_ACCOUNT_THRESHOLD:5}
        account-threshold: ${LOGIN_RATE_LIMIT_ACCOUNT_THRESHOLD:10}
        source-threshold: ${LOGIN_RATE_LIMIT_SOURCE_THRESHOLD:20}
        initial-backoff: ${LOGIN_RATE_LIMIT_INITIAL_BACKOFF:30s}
        max-backoff: ${LOGIN_RATE_LIMIT_MAX_BACKOFF:1h}
        record-ttl: ${LOGIN_RATE_LIMIT_RECORD_TTL:1h}
        source-record-ttl: ${LOGIN_RATE_LIMIT_SOURCE_RECORD_TTL:1m}
        max-source-accounts: ${LOGIN_RATE_LIMIT_MAX_SOURCE_ACCOUNTS:16384}
        max-accounts: ${LOGIN_RATE_LIMIT_MAX_ACCOUNTS:32768}
        max-sources: ${LOGIN_RATE_LIMIT_MAX_SOURCES:4096}
  oauth:
    google:
      enabled: ${GOOGLE_LOGIN_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

logging:
  level:
    # Keep request bodies and rejected password values out of Spring MVC debug/trace logs.
    org.springframework.web: INFO
    # Authorization codes, state and provider tokens must not appear in debug/trace logs.
    org.springframework.security: INFO

management:
  endpoints:
    access:
      default: none
      max-permitted: read-only
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,mappings
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
    info:
      access: read-only
    metrics:
      access: read-only
    mappings:
      access: read-only

server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    csrf:
      enabled: true
  api-docs:
    path: /v3/api-docs

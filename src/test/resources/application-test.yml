spring:
  datasource:
    url: jdbc:h2:mem:board;MODE=MariaDB;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  security:
    csrf:
      rate-limit:
        # Shared integration-test contexts issue many tokens from loopback.
        capacity: 1000
        refill-tokens: 1000
        refill-period: 1m
        max-sources: 4096
    login:
      rate-limit:
        # Keep the general integration-test profile from throttling unrelated tests.
        source-account-threshold: 1000
        account-threshold: 1000
        source-threshold: 1000
        initial-backoff: 1s
        max-backoff: 1m
        record-ttl: 24h
        source-record-ttl: 1m
        max-source-accounts: 65536
        max-accounts: 65536
        max-sources: 65536

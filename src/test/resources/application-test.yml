spring:
  datasource:
    url: jdbc:h2:mem:board;MODE=MariaDB;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  security:
    csrf:
      rate-limit:
        # Shared integration-test contexts issue many tokens from loopback.
        capacity: 1000
        refill-tokens: 1000
        refill-period: 1m
        max-sources: 4096
